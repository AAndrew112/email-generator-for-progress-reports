<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Archive review{% endblock %}</title>
<style>
  :root { --fg:#1d1d1f; --muted:#666; --line:#ddd; --bg:#fafafa; --accent:#2457a6; --warn:#a15c00; }
  body { font: 15px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  header a { color: var(--accent); text-decoration: none; }
  main { padding: 20px; max-width: 1300px; margin: auto; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  .muted { color: var(--muted); }
  .flash { background: #eef4ff; border: 1px solid #c8d8f5; padding: 8px 12px; margin-bottom: 12px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; background: #eee; font-size: 12px; }
  .pill.open { background: #fff1db; color: var(--warn); }
  .grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 20px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid var(--line); padding: 14px; margin-bottom: 16px; }
  textarea { width: 100%; min-height: 320px; font: 14px/1.5 ui-monospace, monospace; box-sizing: border-box; }
  pre { white-space: pre-wrap; word-wrap: break-word; font: 14px/1.5 ui-monospace, monospace; }
  input[type=text] { padding: 4px; }
  button { padding: 5px 12px; cursor: pointer; }
  img.page, video { max-width: 100%; border: 1px solid var(--line); }
  label { display: inline-block; margin: 4px 12px 4px 0; }
  details { margin: 6px 0; }
</style>
</head>
<body>
<header>
  <strong>Personal history archive</strong>
  <a href="{{ url_for('index') }}">Overview</a>
  <a href="{{ url_for('queue') }}">Review queue</a>
  <a href="{{ url_for('records') }}">All records</a>
  <a href="{{ url_for('records', show='undated') }}">Undated</a>
  <form method="post" action="{{ url_for('export') }}" style="margin-left:auto">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button>Export archive</button>
  </form>
</header>
<main>
  {% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
