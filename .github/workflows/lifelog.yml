name: LifeLog

on:
  push:
    branches: [claude/lifelog-wellbeing-tracker-62yabv, main]
    paths: ["LifeLog/**", ".github/workflows/lifelog.yml"]
  pull_request:
    paths: ["LifeLog/**", ".github/workflows/lifelog.yml"]
  workflow_dispatch:

concurrency:
  group: lifelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: LifeLogKit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: swift test
        working-directory: LifeLog/LifeLogKit
        run: swift test

  build:
    name: Build iPhone + Watch apps
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphone|watch"
      - name: Verify the committed Xcode project matches project.yml
        working-directory: LifeLog
        run: |
          brew install xcodegen >/dev/null 2>&1 || true
          if command -v xcodegen >/dev/null; then
            files() { grep -oE '/\* [^*]+\.(swift|plist|entitlements|xcassets|xcconfig) \*/' "$1" | sort -u; }
            files LifeLog.xcodeproj/project.pbxproj > /tmp/committed.txt
            xcodegen generate --quiet
            files LifeLog.xcodeproj/project.pbxproj > /tmp/generated.txt
            if diff /tmp/committed.txt /tmp/generated.txt; then echo "Project file list up to date"; else echo "::error::Run 'xcodegen generate' in LifeLog/ and commit LifeLog.xcodeproj"; exit 1; fi
            git checkout -- LifeLog.xcodeproj
          fi
      - name: Build iOS app (embeds Watch app and widgets)
        working-directory: LifeLog
        run: |
          set -o pipefail
          xcodebuild -project LifeLog.xcodeproj -scheme LifeLog -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Build Watch app on its own
        working-directory: LifeLog
        run: |
          set -o pipefail
          xcodebuild -project LifeLog.xcodeproj -scheme LifeLogWatch -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Build for device (unsigned, Release)
        working-directory: LifeLog
        run: |
          set -o pipefail
          xcodebuild -project LifeLog.xcodeproj -scheme LifeLog -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd-device CODE_SIGNING_ALLOWED=NO -quiet build

  ui-tests:
    name: UI tests (iPhone simulator)
    runs-on: macos-15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          best = None
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      key = (runtime, "Pro" in d["name"], d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"])
          print(best[1])
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
      - name: Run UI tests
        working-directory: LifeLog
        run: |
          set -o pipefail
          xcodebuild test -project LifeLog.xcodeproj -scheme LifeLog \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/UITests.xcresult -derivedDataPath build/dd -quiet
      - name: Export screenshots
        if: always()
        working-directory: LifeLog
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots > /dev/null || true
      - name: Report failures
        if: always()
        working-directory: LifeLog
        run: python3 scripts/ci_report.py failures build/UITests.xcresult || true
      - name: Crash reports
        if: always()
        working-directory: LifeLog
        run: python3 scripts/ci_report.py crashes || true
      - name: Publish screenshots
        if: always()
        working-directory: LifeLog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci_report.py publish build/screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: LifeLog/build/screenshots
          if-no-files-found: ignore

  watch-ui-tests:
    name: UI tests (Watch simulator)
    runs-on: macos-15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
      - name: Pick a Watch simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          best = None
          for runtime, items in devices.items():
              if "watchOS" not in runtime:
                  continue
              for d in items:
                  if d["name"].startswith("Apple Watch"):
                      key = (runtime, d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"])
          print(best[1] if best else "")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID" || xcrun simctl list runtimes
      - name: Run Watch UI tests
        working-directory: LifeLog
        run: |
          set -o pipefail
          xcodebuild test -project LifeLog.xcodeproj -scheme LifeLogWatch \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/WatchUITests.xcresult -derivedDataPath build/dd -quiet
      - name: Report
        if: always()
        working-directory: LifeLog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/WatchUITests.xcresult --output-path build/screenshots > /dev/null || true
          python3 scripts/ci_report.py failures build/WatchUITests.xcresult || true
          python3 scripts/ci_report.py crashes || true
          python3 scripts/ci_report.py publish build/screenshots "LifeLog Watch screenshots" || true
